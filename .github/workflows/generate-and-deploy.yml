name: Generate Playlist & Deploy Pages

on:
  push:
    paths:
      - 'index.md'
      - 'assets/md2m3u.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # (Optional but recommended) Configure Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate M3U playlist
        run: python assets/md2m3u.py assets/playlist.m3u

      - name: Convert index.md to index.html
        run: |
          python - <<'PY'
          import markdown
          with open('index.md', 'r', encoding='utf-8') as f:
              md_content = f.read()
          html_content = markdown.markdown(md_content)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html_content)
          PY
        # Alternatively, use pandoc:
        # - name: Convert Markdown to HTML
        #   run: pandoc index.md -o index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # now includes index.html at the root

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4